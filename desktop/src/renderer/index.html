<!doctype html>
<!-- The menu must never be painted before the launch record says this machine has a workspace.
     "checking" is the honest first frame: the window is chrome plus empty page, nothing to misread. -->
<html lang="zh-CN" data-shell="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>agent-autoloop · 指挥部</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="titlebar">
      <span>agent-autoloop <span class="muted">/ 指挥部</span></span
      ><button id="hide-window" aria-label="收起窗口，驻留托盘">收起窗口</button>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>agent-autoloop</div>
        </div>
        <nav aria-label="主导航" id="navigation"></nav>
        <button id="new-task" class="new-task-button" type="button">＋ 新建任务</button>
        <div class="sidebar-footer">
          <span id="runtime-status" class="sidebar-status" role="status">正在读取本机状态</span>
          <p id="runtime-scope"></p>
          <p id="runtime-role"></p>
          <button id="view-connection" type="button">查看连接</button>
        </div>
      </aside>
      <main id="main" tabindex="-1" aria-labelledby="page-title"></main>
    </div>
    <footer class="statusbar"><span>工作有进展，决策找你</span><button id="quit-app">退出应用…</button></footer>
    <div id="error" class="error" role="alert" hidden></div>
    <noscript>此桌面界面需要启用 JavaScript。</noscript>
  </body>
</html>
