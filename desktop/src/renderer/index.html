<!doctype html>
<!-- The menu must never be painted before the launch record says this machine has a workspace.
     "checking" is the honest first frame: the window is chrome plus empty page, nothing to misread. -->
<html lang="zh-CN" data-shell="checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>指挥部</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- The titlebar stays as the window's drag region; its copy and its buttons are gone, so the
         shell speaks only through pages. -->
    <header class="titlebar" aria-hidden="true"></header>
    <div class="shell">
      <aside class="sidebar" id="sidebar" data-sidebar="expanded">
        <div class="sidebar-header">
          <div class="brand">
            <span class="logo" aria-hidden="true"></span>
            <span class="brand-name">指挥部</span>
          </div>
          <button
            id="sidebar-toggle"
            class="sidebar-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="sidebar"
            aria-label="收起侧边栏"
            title="收起侧边栏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M9 4v16" />
            </svg>
          </button>
        </div>
        <button id="new-task" class="new-task-button" type="button" aria-label="派发任务" title="派发任务">
          <svg class="new-task-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14 M5 12h14" />
          </svg>
          <span class="new-task-label">派发任务</span>
          <kbd class="sidebar-shortcut" id="new-task-shortcut" aria-hidden="true"></kbd>
        </button>
        <nav aria-label="主导航" id="navigation"></nav>
        <div class="sidebar-footer">
          <button
            id="view-connection"
            class="sidebar-status-card"
            type="button"
            aria-label="查看连接与运行状态"
            title="查看连接与运行状态"
          >
            <span class="sidebar-status-body">
              <span id="runtime-status" class="sidebar-status" role="status">
                <span class="sidebar-status-dot" aria-hidden="true"></span>
                <span id="runtime-status-text" class="sidebar-status-text">正在读取本机状态</span>
              </span>
              <span id="runtime-meta" class="sidebar-status-meta" hidden>
                <span id="runtime-role" class="sidebar-role" hidden></span>
                <span id="runtime-scope" class="sidebar-scope" hidden></span>
              </span>
            </span>
            <svg class="sidebar-status-chevron" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </aside>
      <main id="main" tabindex="-1" aria-labelledby="page-title"></main>
    </div>
    <div id="error" class="error" role="alert" hidden></div>
    <noscript>此桌面界面需要启用 JavaScript。</noscript>
  </body>
</html>
