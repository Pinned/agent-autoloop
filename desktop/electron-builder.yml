# What the app needs at runtime but must not keep inside asar: the business sources it copies per
# request and the verified official Node archive. scripts/stage.mjs produces exactly this shape.
appId: com.autoloop.desktop
productName: 指挥部
directories:
  output: release
  buildResources: assets
# The local Electron install ships the app; no second download, no surprises.
electronDist: node_modules/electron/dist
asar: true
files:
  - dist/**
  - package.json
extraResources:
  - from: stage
    to: autoloop
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: assets/icon.icns
  # V1 ships unsigned for local use; signing is a later release decision.
  identity: null
